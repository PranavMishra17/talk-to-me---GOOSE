<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goose demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFF8E7;--ink:#1A1423;--balloon:#FFD23F;--radio:#E63946;--sky:#4CC9F0;--mute:#5E5868}
  @media (prefers-color-scheme: dark){:root{--paper:#1A1423;--ink:#FFF8E7;--mute:#B9B3C4}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:28px 20px}
  h1{font:400 clamp(44px,7vw,76px)/1 Bangers,Impact,sans-serif;letter-spacing:.03em;margin:0 0 20px}
  .run{display:block;width:100%;text-align:left;margin:0 0 20px;padding:18px 24px;cursor:pointer;color:#1A1423;background:var(--balloon);border:3px solid #1A1423;box-shadow:5px 5px 0 #1A1423;font:inherit;transition:transform .12s ease-out,box-shadow .12s ease-out}
  .run:nth-of-type(2){background:var(--sky)}
  .run:nth-of-type(3){background:var(--radio);color:#fff}
  .run:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 #1A1423}
  .run:active{transform:translate(5px,5px);box-shadow:0 0 0 #1A1423}
  .run:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
  .run[disabled]{opacity:.6;cursor:default}
  .run b{display:block;font:400 clamp(32px,4.6vw,50px)/1.05 Bangers,Impact,sans-serif;letter-spacing:.03em}
  nav a{color:inherit;font-weight:700;margin-right:18px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Goose demo</h1>
  <button class="run" data-owner="pranav" data-pack="goose" data-as="Muhammad Rahman" data-allowed="maya"><b>1. Muhammad calls Goose</b>Opens a room for Pranav and joins as Muhammad.</button>
  <button class="run" id="talk"><b>2. Pranav talks to Goose</b>Opens the app and starts the private talk.</button>
  <button class="run" data-owner="skyler" data-pack="jesse" data-as="" data-allowed=""><b>3. Push Jesse until Jesse hangs up</b>Opens a room for Skyler and joins as an unknown caller.</button>
  <nav><a href="/">Landing page</a><a href="/app">Pranav's app</a></nav>
</main>
<script>
document.getElementById('talk').onclick = () => { location.href = '/app?talk=1'; };
document.querySelectorAll('.run[data-owner]').forEach(b => { b.onclick = async () => {
  b.disabled = true;
  try {
    const r = await fetch('/rooms', {method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({owner: b.dataset.owner, pack: b.dataset.pack, allowed: b.dataset.allowed ? [b.dataset.allowed] : []})});
    if (!r.ok) throw new Error(r.status);
    location.href = `${(await r.json()).url}&as=${encodeURIComponent(b.dataset.as)}&join=1`;
  } catch { b.disabled = false; alert('Backend not running: POST /rooms'); }
}; });
</script>
</body>
</html>
