<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFF8E7;--ink:#1A1423;--balloon:#FFD23F;--radio:#E63946;--sky:#4CC9F0;--mute:#5E5868;--shadow:5px 5px 0 var(--ink);
    --night:#1A1423;--cream:#FFF8E7}   /* --night and --cream sit on balloon and on the talk view, and do not flip in dark mode */
  @media (prefers-color-scheme: dark){:root{--paper:#1A1423;--ink:#FFF8E7;--mute:#B9B3C4}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;
    background-image:radial-gradient(color-mix(in oklab,var(--ink) 9%,transparent) 1px,transparent 1px);background-size:14px 14px}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--sky);outline-offset:3px}
  h1,h2,p,ul{margin:0}
  ul{list-style:none;padding:0}
  h1,h2{font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.03em;line-height:.95}

  /* Home */
  #home{min-height:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .perch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 24px;text-align:center;background:var(--balloon);color:var(--night);border-right:3px solid var(--ink)}
  .perch h1{font-size:clamp(40px,5vw,60px);max-width:10em}
  .egg{appearance:none;cursor:pointer;width:min(68vw,270px);aspect-ratio:4/5;padding:0 26px;color:var(--night);background:var(--cream);
    border:3px solid var(--night);border-radius:50% 50% 50% 50%/62% 62% 40% 40%;box-shadow:5px 5px 0 var(--night);
    font:400 38px/1 Bangers,Impact,sans-serif;letter-spacing:.03em;transition:transform .12s ease-out,box-shadow .12s ease-out}
  .egg:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--night)}
  .egg:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--night)}
  .egg:focus-visible{outline-color:var(--night)}
  .dial{font-size:16px}
  .dial a{font-weight:700;white-space:nowrap}
  .live{display:inline-block;background:var(--radio);color:#fff;padding:6px 14px;border:3px solid var(--night);box-shadow:3px 3px 0 var(--night);font-weight:700;text-decoration:none}
  .packs{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
  .packs legend{float:left;margin-right:6px;padding:0;font-weight:700}
  .packs input{position:absolute;opacity:0}
  .packs span{display:block;padding:3px 12px;border:2px solid var(--night);font-weight:700;cursor:pointer}
  .packs input:checked+span{background:var(--night);color:var(--cream)}
  .packs input:focus-visible+span{outline:3px solid var(--night);outline-offset:2px}

  .sheet{padding:40px clamp(20px,5vw,56px);min-width:0}
  .sheet h2{font-size:38px}
  .sheethead{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
  .sheethead h2{margin-right:auto}
  .sheethead a{font-weight:700}
  .call,.row{display:block;padding:14px 0;border-top:3px solid var(--ink);text-decoration:none}
  .call:hover .who{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
  .top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .who{font-weight:700;font-size:18px;overflow-wrap:anywhere}
  .when{color:var(--mute);font-size:15px;margin-right:auto}
  .sum{max-width:62ch}
  .badge{font-size:14px;font-weight:700;padding:1px 9px;border:2px solid #1A1423;white-space:nowrap;background:var(--cream);color:#1A1423}
  .badge.needs_you{background:var(--radio);color:#fff}
  .badge.resolved{background:var(--sky)}
  .badge.info{background:var(--balloon)}
  .quiet{color:var(--mute);padding:14px 0}
  .badge[class*=t-]{text-transform:capitalize}
  .badge.t-public{background:var(--sky)}
  .badge.t-friends{background:var(--balloon)}
  .badge.t-family{background:#F8961E}
  .badge.t-private{background:var(--radio);color:#fff}
  .row .when{margin-right:0}
  .row .top .who{margin-right:auto}
  .row .who{font-size:17px}
  .legend{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;justify-items:start;margin:16px 0 0}

  /* Call detail */
  #detail{min-height:100%;padding:28px 20px 64px}
  .col{max-width:680px;margin:0 auto}
  .back{display:inline-block;margin-bottom:22px;font-weight:700}
  #detail h1{font-size:clamp(40px,7vw,56px);overflow-wrap:anywhere}
  .meta{color:var(--mute);margin:6px 0 14px}
  .meta::first-letter{text-transform:uppercase}
  #detail h2{font-size:30px;margin:30px 0 10px}
  .acts li{padding:4px 0 4px 30px;position:relative}
  .acts li::before{content:"";position:absolute;left:0;top:8px;width:18px;height:18px;border:3px solid var(--ink)}
  .acts li.done::before{background:var(--sky)}
  .acts li.done{color:var(--mute)}
  .chat{display:flex;flex-direction:column;gap:10px}
  .say{max-width:82%;padding:8px 13px;border:2px solid var(--ink);border-radius:14px 14px 14px 3px;align-self:flex-start;overflow-wrap:anywhere}
  .say.goose{background:var(--balloon);color:#1A1423;border-color:#1A1423;align-self:flex-end;border-radius:14px 14px 3px 14px}
  .say b{display:block;font-size:14px}
  .panel{border:3px solid var(--ink);box-shadow:var(--shadow);padding:12px 16px;margin-top:16px}
  .panel .done{text-decoration:line-through;color:var(--mute)}

  /* Talk */
  #talk{height:100%;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px;background:var(--night);color:var(--cream)}
  .orb{flex:none;width:min(34vh,180px);aspect-ratio:4/5;margin-top:16px;background:var(--cream);border:3px solid var(--cream);border-radius:50% 50% 50% 50%/62% 62% 40% 40%;transition:transform .12s ease-out}
  #talk.goose .orb{background:var(--balloon);transform:scale(1.04)}
  #talk.you .orb{background:var(--sky);transform:scale(.95)}
  #talk.waiting .orb{opacity:.45}
  #state{font:400 32px/1.1 Bangers,Impact,sans-serif;letter-spacing:.03em;text-align:center}
  #lines{flex:1;min-height:0;width:100%;max-width:640px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
  #lines .say{border-color:var(--cream);color:var(--cream)}
  #lines .say.goose{background:var(--balloon);border-color:#1A1423;color:#1A1423}
  #end{flex:none;appearance:none;cursor:pointer;padding:9px 26px;background:var(--radio);color:#fff;border:3px solid var(--cream);font:400 21px Bangers,Impact,sans-serif;letter-spacing:.04em}

  [hidden]{display:none!important}
  @media (max-width:800px){
    #home{grid-template-columns:minmax(0,1fr)}
    .perch{padding:32px 16px 36px;border-right:0;border-bottom:3px solid var(--ink)}
    .sheet{padding:24px 16px 48px}
    .egg{font-size:33px;width:min(58vw,230px)}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="home" hidden>
  <section class="perch">
    <h1 id="hi">Hi, how are you?</h1>
    <button class="egg" id="talkBtn">Talk to me, Goose</button>
    <fieldset class="packs" id="packs" hidden><legend>Personality</legend></fieldset>
    <a class="live" id="live" hidden>Goose is on a call right now</a>
    <p class="dial" id="dial" hidden>Anyone can call Goose on <a id="dialNum"></a></p>
  </section>
  <section class="sheet">
    <div class="sheethead"><h2>Calls</h2><a href="#/contacts">Contacts</a><a href="#/data">My data</a><a href="/demo">Demo</a><a href="/">Landing page</a></div>
    <div id="calls"></div>
    <div class="sheethead" style="margin-top:34px"><h2>Calendar</h2></div>
    <div id="cal"></div>
  </section>
</div>

<div id="detail" hidden><div class="col">
  <a class="back" href="#/">Home</a>
  <div id="record"></div>
</div></div>

<div id="talk" class="waiting" hidden>
  <div class="orb" aria-hidden="true"></div>
  <p id="state" role="status">Calling Goose</p>
  <div id="lines" aria-live="polite"></div>
  <div id="input" style="flex:none;width:100%;max-width:640px"></div>
  <button id="end">End talk</button>
</div>

<script type="module">
import {inputBar, liveInput} from '/talkmode.js';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get = async url => { const r = await fetch(url); if (!r.ok) throw new Error(`${url} answered ${r.status}`); return r.json(); };
const OUTCOME = {resolved: 'Resolved', needs_you: 'Needs you', info: 'Info'};
const tierBadge = t => `<span class="badge t-${esc(t)}">${esc(t)}</span>`;
const badge = o => `<span class="badge ${esc(o)}">${esc(OUTCOME[o] || o)}</span>`;
const isGoose = (who, c) => ['goose', 'agent', 'assistant', c.persona].includes(String(who).toLowerCase());
const name = c => c.kind === 'owner' ? 'You and Goose' : c.contact?.name || c.number || 'Unknown caller';

function when(iso) {
  const d = new Date(iso), days = Math.round((new Date().setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 864e5);
  const day = days === 0 ? 'Today' : days === 1 ? 'Yesterday' : d.toLocaleDateString([], {month: 'short', day: 'numeric'});
  return `${day}, ${d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})}`;
}

/* Home */
let me = {};
async function loadHome() {
  try {
    const calls = await get('/api/calls');
    $('calls').innerHTML = calls.map(c => `<a class="call" href="#/call/${encodeURIComponent(c.id)}">
      <div class="top"><span class="who">${esc(name(c))}</span><span class="when">${esc(when(c.started_at))}</span>${badge(c.outcome)}</div>
      <p class="sum">${esc(c.summary)}</p></a>`).join('')
      || `<p class="quiet">No calls yet. ${me.dial_in ? `Call ${esc(me.dial_in)} and Goose will pick up.` : 'They will show up here when Goose answers one.'}</p>`;
  } catch (e) { $('calls').innerHTML = `<p class="quiet">Could not load calls: ${esc(e.message)}. Check that the server is running.</p>`; }
  try {
    const today = new Date().toISOString().slice(0, 10);
    const rows = (await get('/api/data')).calendar.filter(e => e.start.slice(0, 10) >= today).sort((a, b) => a.start.localeCompare(b.start));
    $('cal').innerHTML = rows.map(e => `<div class="row"><div class="top"><span class="who">${esc(e.title)}</span>${tierBadge(e.tier)}</div>
      <p class="when">${esc(when(e.start))}${e.where ? `, ${esc(e.where)}` : ''}</p></div>`).join('') || '<p class="quiet">Nothing coming up.</p>';
  } catch { $('cal').innerHTML = '<p class="quiet">Could not load the calendar.</p>'; }
  try {
    const on = (await get('/api/rooms')).rooms.find(r => r.room.startsWith('call-'));
    $('live').hidden = !on;
    if (on) $('live').href = `#/live/${encodeURIComponent(on.room)}`;
  } catch { $('live').hidden = true; }   // no LiveKit keys: history still works
}

/* Call detail */
async function loadCall(id) {
  $('record').innerHTML = '';
  let c;
  try { c = await get(`/api/calls/${encodeURIComponent(id)}`); }
  catch { $('record').innerHTML = '<h1>Call not found</h1><p class="meta">It may have been removed. Pick another from the list.</p>'; return; }
  const mins = c.ended_at ? Math.max(1, Math.round((new Date(c.ended_at) - new Date(c.started_at)) / 6e4)) : 0;
  const whoLine = [c.contact?.relationship, c.contact && c.number && `\u2022\u2022\u2022\u2022 ${c.number.replace(/\D/g, '').slice(-4)}`].filter(Boolean).join(', ');
  $('record').innerHTML = `<h1>${esc(name(c))}</h1>
    <p class="meta">${whoLine ? esc(whoLine) + '<br>' : ''}${esc(when(c.started_at))}${mins ? `, ${mins} min` : ''}</p>
    ${badge(c.outcome)}
    <h2>Summary</h2><p>${esc(c.summary)}</p>
    ${c.actions?.length ? `<h2>Actions</h2><ul class="acts">${c.actions.map(a => `<li class="${a.done ? 'done' : ''}">${esc(a.text)}</li>`).join('')}</ul>` : ''}
    <h2>Transcript</h2>
    <div class="chat">${(c.transcript || []).map(t => {
      const g = isGoose(t.who, c);
      return `<div class="say ${g ? 'goose' : ''}"><b>${g ? 'Goose' : c.kind === 'owner' ? 'You' : esc(c.contact?.name || 'Caller')}</b>${esc(t.text)}</div>`;
    }).join('') || '<p class="quiet">No transcript was saved for this call.</p>'}</div>`;
}

/* Contacts */
async function loadContacts() {
  const list = await get('/api/contacts');
  $('record').innerHTML = `<h1>Contacts</h1>
    <p class="meta">A contact's tier decides what Goose may tell them. Numbers show the last 4 digits only.</p>
    ${list.map(c => `<div class="row"><div class="top"><span class="who">${esc(c.name)}</span>${tierBadge(c.tier)}</div>
      <p class="when">${esc(c.relationship)}${c.numbers.length ? `, ${esc(c.numbers.join(', '))}` : ''}</p></div>`).join('')
      || '<p class="quiet">No contacts yet. Add them to data/contacts.local.json.</p>'}`;
}

/* My data */
const SOURCES = [
  ['gmail', 'Gmail', r => [r.subject, `From ${r.from}, ${when(r.date)}`]],
  ['slack', 'Slack', r => [r.text, `${r.channel}, ${r.from}`]],
  ['calendar', 'Calendar', r => [r.title, [when(r.start), r.where].filter(Boolean).join(', ')]],
  ['notes', 'Notes', r => [r.title, r.text]],
  ['tasks', 'Tasks', r => [r.text, r.due ? `Due ${r.due}${r.done ? ', done' : ''}` : '']],
];
async function loadData() {
  const data = await get('/api/data');
  $('record').innerHTML = `<h1>My data</h1>
    <p class="meta">Goose checks every record's tier in code, so the model never sees one above the caller's tier.</p>
    <div class="legend">
      ${tierBadge('public')}<span>Anyone who calls</span>
      ${tierBadge('friends')}<span>Friends and family</span>
      ${tierBadge('family')}<span>Family only</span>
      ${tierBadge('private')}<span>Never shared on a phone call</span>
    </div>
    ${SOURCES.map(([key, label, show]) => `<h2>${label}</h2>${data[key].map(r => {
      const [title, sub] = show(r);
      return `<div class="row"><div class="top"><span class="who">${esc(title)}</span>${tierBadge(r.tier)}</div><p class="when">${esc(sub)}</p></div>`;
    }).join('') || '<p class="quiet">Nothing here yet.</p>'}`).join('')}`;
}

/* Live call panel */
async function loadLive(room) {
  try {
    const s = await get(`/api/rooms/${encodeURIComponent(room)}`);
    const agent = a => `<div class="panel"><b>Goose for ${esc(a.owner)}</b>, caller is ${esc(a.caller_tier)}
      <ul>${(a.agenda || []).map(i => `<li class="${i.done ? 'done' : ''}">${esc(i.goal)}${i.id === a.focus ? ' (now)' : ''}</li>`).join('')}</ul>
      ${a.pending_confirm ? `<p>Waiting for a yes: ${esc(a.pending_confirm)}</p>` : ''}${a.summary ? `<p>${esc(a.summary)}</p>` : ''}</div>`;
    $('record').innerHTML = `<h1>Live call</h1>
      <p class="meta">In the room: ${esc(s.participants.map(p => p.identity + (p.agent_state ? ` (${p.agent_state})` : '')).join(', ') || 'nobody yet')}</p>
      <p>${s.floor.holder ? `${esc(s.floor.holder)} has the floor` : 'The floor is free'}</p>
      ${Object.values(s.agents).map(agent).join('')}`;
  } catch { $('record').innerHTML = '<h1>The call has ended</h1><p class="meta">Its record will appear under All calls.</p>'; }
}

/* Talk */
const LK = 'https://cdn.jsdelivr.net/npm/livekit-client@2.15.4/+esm';
const bar = inputBar($('input'), text => say(`typed-${Date.now()}`, 'you', text));
let talk = null;   // {end()} while a session is open

function setState(mode, text) { $('talk').className = mode; $('state').textContent = text; }

function say(seg, who, text) {   // one bubble per segment; a later piece of the same segment replaces it
  if (!text) return;
  const id = `seg-${seg}`;
  let el = document.getElementById(id);
  if (!el) {
    el = Object.assign(document.createElement('div'), {id, className: `say ${who === 'goose' ? 'goose' : ''}`});
    $('lines').append(el);
  }
  el.textContent = text;
  $('lines').scrollTop = $('lines').scrollHeight;
}

function mockTalk() {   // GOOSE_MOCK: same view, scripted, no room
  const script = [['goose', 'goose', 'Goose is talking', 'Hey Pranav. What do you need?'], ['you', 'you', "You're talking", 'Anything I should know about today?'],
    ['goose', 'goose', 'Goose is talking', 'Sam wants dinner Saturday at seven. He is waiting on a yes.'], ['listening', 'goose', 'Goose is listening', '']];
  let i = 0;
  const t = setInterval(() => {
    const [mode, who, label, text] = script[i];
    setState(mode, label); say(i, who, text);
    if (++i === script.length) clearInterval(t);
  }, 1200);
  bar.attach({hasMic: true, mic(on) { if (on) setState('you', "You're talking"); }, turn() {},
    send() { setTimeout(() => say(`reply-${Date.now()}`, 'goose', 'Got it.'), 800); }});
  return {end() { clearInterval(t); }};
}

async function liveTalk({url, token}) {
  const {Room, RoomEvent, createLocalAudioTrack} = await import(LK);
  const room = new Room();
  let agent = null, you = false;
  const show = () => you ? setState('you', "You're talking")
    : agent === 'speaking' ? setState('goose', 'Goose is talking')
    : agent === 'thinking' ? setState('thinking', 'Goose is thinking')
    : agent ? setState('listening', 'Goose is listening')
    : setState('waiting', 'Waiting for Goose');
  const late = setTimeout(() => { if (!agent) setState('waiting', 'Goose has not picked up. Check that the worker is running.'); }, 15000);

  room.registerTextStreamHandler('lk.transcription', async (reader, from) => {
    const who = from.identity === room.localParticipant.identity ? 'you' : 'goose';
    const seg = reader.info.attributes?.['lk.segment_id'] || reader.info.id;
    let text = '';
    for await (const piece of reader) { text += piece; say(seg, who, text); }
  });
  room.on(RoomEvent.TrackSubscribed, t => { if (t.kind === 'audio') document.body.append(t.attach()); });
  room.on(RoomEvent.TrackUnsubscribed, t => t.detach().forEach(el => el.remove()));
  room.on(RoomEvent.ParticipantAttributesChanged, (changed, p) => {
    if (p !== room.localParticipant && p.attributes['lk.agent.state']) { agent = p.attributes['lk.agent.state']; show(); }
  });
  room.on(RoomEvent.ActiveSpeakersChanged, speakers => { you = speakers.includes(room.localParticipant); show(); });
  room.on(RoomEvent.Disconnected, () => { if (talk) location.hash = '#/'; });

  const session = {end() { clearTimeout(late); room.disconnect(); }};
  try {
    await room.connect(url, token);
    bar.attach(await liveInput(room, createLocalAudioTrack));
    await room.startAudio();
  } catch (e) { session.end(); throw e; }   // leave, or the room stays open with Goose in it
  show();
  return session;
}

function endTalk() {
  const t = talk;
  talk = null;
  bar.detach();
  t?.end?.();
  document.querySelectorAll('body > audio').forEach(a => a.remove());
}

$('talkBtn').onclick = async () => {
  talk = {};
  $('lines').replaceChildren();
  setState('waiting', 'Calling Goose');
  location.hash = '#/talk';
  const mine = talk;
  try {
    const pack = document.querySelector('input[name=pack]:checked')?.value;
    const r = await fetch('/api/talk', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({pack})});
    if (!r.ok) throw new Error(`the server answered ${r.status}`);
    const res = await r.json();
    const s = res.url ? await liveTalk(res) : mockTalk();
    if (talk === mine) mine.end = s.end; else s.end();   // ended while connecting
  } catch (e) {
    if (talk !== mine) return;
    setState('waiting', e.name === 'NotAllowedError' ? 'Allow the microphone for this page, then try again.' : `Could not reach Goose: ${e.message}`);
    $('end').textContent = 'Back';
  }
};
$('end').onclick = () => { location.hash = '#/'; };

/* Routes */
let timer;
function route() {
  clearInterval(timer);
  const [, view, id] = location.hash.split('/').map(decodeURIComponent);
  if (view !== 'talk' && talk) endTalk();
  if (view === 'talk' && !talk) { location.hash = '#/'; return; }   // a reload cannot reopen the mic without a click
  $('home').hidden = !!view;
  $('detail').hidden = !['call', 'live', 'contacts', 'data'].includes(view);
  $('talk').hidden = view !== 'talk';
  scrollTo(0, 0);
  if (view === 'talk') $('end').textContent = 'End talk';
  else if (view === 'call') loadCall(id);
  else if (view === 'contacts' || view === 'data') {
    $('record').innerHTML = '';
    (view === 'data' ? loadData : loadContacts)().catch(e => { $('record').innerHTML = `<h1>Could not load this page</h1><p class="meta">${esc(e.message)}. Check that the server is running.</p>`; });
  }
  else if (view === 'live') { $('record').innerHTML = ''; loadLive(id); timer = setInterval(() => loadLive(id), 1000); }
  else { loadHome(); timer = setInterval(loadHome, 4000); }
}
addEventListener('hashchange', route);

me = await get('/api/me').catch(() => ({}));
if (me.owner) $('hi').textContent = `Hi ${me.owner}, how are you?`;
if (me.dial_in) {
  $('dial').hidden = false;
  $('dialNum').textContent = me.dial_in;
  $('dialNum').href = `tel:${me.dial_in.replace(/\s/g, '')}`;
}
const packs = await get('/packs').catch(() => []);
if (packs.length) {
  $('packs').hidden = false;
  $('packs').insertAdjacentHTML('beforeend', packs.map(p => `<label><input type="radio" name="pack" value="${esc(p.id)}" ${p.id === 'goose' ? 'checked' : ''}>
    <span>${esc(p.name)}</span></label>`).join(''));
}
route();
if (new URLSearchParams(location.search).has('talk')) $('talkBtn').click();   // the /demo button
</script>
</body>
