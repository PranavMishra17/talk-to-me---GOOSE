[project]
name = "goose-lab"
version = "0.1.0"
description = "Goose lab repo: proxy_core (pure logic) + thin LiveKit wiring"
requires-python = ">=3.10"
dependencies = [
  "livekit-agents>=1.8,<1.9",
  "livekit-api",
  "python-dotenv",
  "pyyaml",
  "httpx",
  "fastapi",
  "uvicorn",
  "livekit-plugins-openai>=1.8,<1.9",
  "livekit-plugins-cartesia>=1.8,<1.9",
]
# Do NOT add livekit-plugins-turn-detector or livekit-plugins-silero (inference.* replaces them).

[project.optional-dependencies]
# Cloud-only; BVC noise cancellation. Skipped in tests.
nc = ["livekit-plugins-noise-cancellation"]
optimize = [
    "dspy>=3.4.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
