# Everything model-related lives here. `kind` picks a constructor in app/providers.py;
# unknown kinds raise at startup. `mock` works for every provider and touches no network.
# Always launch with `dev`: self-hosted `start` silently drops adaptive interruption to VAD.
providers:
  # The one switch. true runs stt_own, llm_own and tts_own instead of stt, llm and tts, for when LiveKit Inference answers 429.
  # Needs OPENROUTER_API_KEY and CARTESIA_API_KEY in .env. Proved in a real room on 6 Nov: first audio 0.84 to 2.04 s.
  own_keys: false
  stt_own: {kind: cartesia, model: ink-2, language: en}
  stt:
    kind: livekit_inference
    model: deepgram/nova-3             # won the A/B on 6 Nov: 228 ms finalize p50 against the starter's 365 ms
    language: en
    flux: {eager_eot_threshold: 0.4, eot_threshold: 0.8}   # sent only when the model is flux
  stt_flux: {kind: deepgram_flux, model: deepgram/flux-general-en}       # swap into stt, with turn.turn_detection: stt
  stt_starter: {kind: livekit_inference, model: assemblyai/universal-3-6-pro, language: en}   # starter default, lost the A/B on latency
  stt_alt: {kind: livekit_inference, model: assemblyai/universal-3-5-pro}   # on Inference, no BYO key. 66 ms finalize, best telephony WER.
  # scripts/model_ab.py, 6 Nov, gate on, 24 turns each, end of stream p50 / p90: gemma 224-230 / 576-1134 ms, 0 bad.
  llm: {kind: livekit_inference, model: google/gemma-4-31b-it}           # starter default, kept: no challenger won p50 by 15%
  llm_own: {kind: openrouter, model: google/gemini-2.5-flash-lite}
  llm_flash_lite: {kind: livekit_inference, model: google/gemini-2.5-flash-lite}   # 245 / 885 ms, 0 bad
  llm_3_1: {kind: livekit_inference, model: google/gemini-3.1-flash-lite}          # 663 / 843 ms, 0 bad
  llm_3_5: {kind: livekit_inference, model: google/gemini-3.5-flash-lite}          # 373 ms TTFT, earlier run. Not gemini-3.8-flash (2.3 s).
  llm_tools: {enabled: false, model: openai/gpt-5.6-luna}                # optional per-turn route for tool turns; off, nothing reads it yet
  tts: {kind: livekit_inference, model: cartesia/sonic-3.5, language: en}   # won the A/B on 6 Nov: 160 ms first audio p50 against Fish's 66
  tts_own: {kind: cartesia, model: sonic-3.5, language: en}              # same voice ids as Inference
  # starter default, lost the A/B on latency; on Inference, no key. Copy into tts to use it. expressive sets AgentSession(expressive=True):
  # the LLM adds delivery tags Fish renders. Voice: the pack's fish_voice, one per pack, so Goose and Maya stay distinct on Fish too.
  tts_fish: {kind: livekit_inference, model: fishaudio/s2.1-pro, language: en, expressive: true}
  vad: {kind: livekit_inference, model: silero}
  noise_cancellation: {kind: bvc_telephony}                              # none | bvc_telephony | mock. Applied to SIP participants only.
turn:
  turn_detection: audio            # audio | stt | vad
  endpointing: {mode: dynamic, min_delay: 0.3, max_delay: 1.5}           # holds over 1.5 s read as dead air
  # Adaptive is suppressed in the first ~1 s of agent speech (backchannel_boundary). Real barge-ins never replay the tail; only false interruptions resume.
  interruption: {mode: adaptive, min_duration: 0.5, min_words: 0, false_interruption_timeout: 1.5, resume_false_interruption: true}
  preemptive_generation: {enabled: true, preemptive_tts: false}
  user_turn_limit: {max_duration: 30.0}
decider:
  backend: jev                     # jev | keyword | llm | mock | laya_local (stub, local fallback)
  jev_model: "~typesafe/jev-latest"
  llm_model: google/gemini-2.5-flash-lite
  addressee_confidence: 0.7        # below this, Jev's addressee counts as nobody
  hook_wait_s: 0.3                 # longest the reply may wait on a Jev answer started at the STT final
session:
  silence_nudges_s: [6, 12, 20]
  backchannel_allowlist: [yeah, ok, mm-hm, right, sure, go on]
  echo: {window_s: 3.0, overlap: 0.7}
limits: {max_turns_per_item: 3, max_turns_per_call: 40, max_summons: 2, floor_lease_s: 20, max_agent_streak: 2}
personas:
  # A network shares contacts and can be summoned. No network: nothing of anyone else reaches this persona's calls.
  goose: {owner: pranav, pack: goose, network: honk}
  maya: {owner: rohan, pack: jarvis, network: honk}
  jesse: {owner: skyler, pack: jesse}
